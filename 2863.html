<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connoisseur Mineral Outfitters - Specimen</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 1.25rem;
      background-color: #fafafa;
      color: #222;
      text-align: center;
      line-height: 1.45;
    }

    /* --- Header --- */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .logo {
      width: 85px; /* slightly smaller for mobile balance */
      height: auto;
    }

    .company-name {
      text-align: left;
      font-weight: 600;
      font-size: 1.35rem;
      color: #333;
      line-height: 1.25;
      letter-spacing: 0.3px; /* subtle refinement */
    }

    /* --- Photo --- */
    .specimen-photo {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      margin-bottom: 1rem;
    }

    /* --- Text Blocks --- */
    h1 {
      font-size: 1.35rem;
      margin: 0.75rem 0 0.4rem 0;
      font-weight: 600;
      color: #222;
    }

    p {
      margin: 0.3rem 0;
      font-size: 1.05rem;
      color: #333;
    }

    .provenance {
      margin-top: 0.6rem;
      font-size: 0.98rem;
      color: #444;
      padding: 0 0.5rem;
    }

    /* --- Footer --- */
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo4.jpg" alt="CMO Logo" class="logo">
    <div class="company-name">
      Connoisseur<br>
      Mineral<br>
      Outfitters
    </div>
  </header>

  <img src="images/2863.jpg" alt="Specimen photo" class="specimen-photo">

  <h1>Tabasco Geode Pair</h1>
  <p>Rancho Agua Blanca, Near Tabasco Municipality, Zacatecas, Mexico</p>
  

  <footer>© Connoisseur Mineral Outfitters</footer>

</body>
</html>
