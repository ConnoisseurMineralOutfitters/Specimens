<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connoisseur Mineral Outfitters - Specimen</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #fafafa;
      color: #222;
      text-align: center;
    }
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .logo {
      width: 80px;
      height: auto;
    }
    .company-name {
      text-align: left;
      font-weight: 600;
      font-size: 1.4rem;
      color: #333;
      line-height: 1.3;
    }
    img.specimen {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0.5rem 0;
    }
    p {
      margin: 0.25rem 0;
      font-size: 1rem;
    }
    footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo4.jpg" alt="CMO Logo" class="logo">
    <div class="company-name">
      Connoisseur<br>
      Mineral<br>
      Outfitters
    </div>
  </header>

  <img src="2861.jpg" alt="Specimen photo" class="specimen">

  <h1>Tabasco Geode</h1>
  <p>Locality: Rancho Agua Blanca, Near Tabasco Municipality, Zacatecas, Mexico</p>

  <footer>© Connoisseur Mineral Outfitters</footer>
</body>
</html>
