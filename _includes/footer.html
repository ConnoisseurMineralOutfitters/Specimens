  <!-- Navigation container -->
  <div id="specimen-nav"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  // Extract the filename from the URL
  const path = window.location.pathname; 
  // Example: "/Specimens/2862.html"

  const match = path.match(/\/Specimens\/(\d+)\.html$/i);

  if (match) {
    const id = parseInt(match[1], 10);
    const prev = id - 1;
    const next = id + 1;

    const nav = document.getElementById("specimen-nav");

    nav.innerHTML = `
      <a href="/Specimens/${prev}.html">← Previous (${prev})</a>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <a href="/Specimens/${next}.html">Next (${next}) →</a>
    `;
  }
});
</script>
