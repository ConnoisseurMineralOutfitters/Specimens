<footer>
  © Connoisseur Mineral Outfitters<br>
  <a href="https://www.etsy.com/shop/ConnoisseurMineralOutfitters" target="_blank">Shop on Etsy</a>
  <a href="https://www.instagram.com/dennisd3miller" target="_blank">@dennisd3miller</a>
  <a href="https://www.instagram.com/crystalculprit" target="_blank">@crystalculprit</a>

  <!-- Navigation container -->
  <div id="specimen-nav"></div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // Extract current page ID from URL
  const currentID = parseInt(
    window.location.pathname.match(/(\d+)\.html$/)?.[1] || "0",
    10
  );

  // Safe metadata parser
  function safeID(metaValue, fallback) {
    const n = parseInt(metaValue, 10);
    return Number.isFinite(n) ? n : fallback;
  }

  // Read metadata OR fall back to currentID ± 1
  const prevCatalogID = safeID(
    document.querySelector('meta[name="prev-id"]')?.content,
    currentID - 1
  );

  const nextCatalogID = safeID(
    document.querySelector('meta[name="next-id"]')?.content,
    currentID + 1
  );

  const footer = document.querySelector("footer");
  if (!footer) return;

  const nav = document.createElement("div");
  nav.className = "catalog-nav";

  // Helper: check if a page exists using HEAD
  function pageExists(id) {
    return fetch(`/Specimens/${id}.html`, { method: "HEAD" })
      .then(res => res.ok)
      .catch(() => false);
  }

  // Find previous published page
  async function findPrevPublished(startID) {
    let id = startID;
    while (id >= 3) {
      if (await pageExists(id)) return id;
      id--;
    }
    return null;
  }

  // Find next published page
  async function findNextPublished(startID) {
    let id = startID;
    while (id >= 3) {
      if (await pageExists(id)) return id;
      id++;
    }
    return null;
  }

  // Build navigation once both checks complete
  Promise.all([
    findPrevPublished(prevCatalogID),
    findNextPublished(nextCatalogID)
  ]).then(([prevPublished, nextPublished]) => {

    if (prevPublished) {
      const prevLink = document.createElement("a");
      prevLink.href = `/Specimens/${prevPublished}.html`;
      prevLink.textContent = "← Previous";
      nav.appendChild(prevLink);
    }

    if (prevPublished && nextPublished) {
      const divider = document.createElement("span");
      divider.textContent = " | ";
      nav.appendChild(divider);
    }

    if (nextPublished) {
      const nextLink = document.createElement("a");
      nextLink.href = `/Specimens/${nextPublished}.html`;
      nextLink.textContent = "Next →";
      nav.appendChild(nextLink);
    }

    // Only append nav if it has content
    if (nav.childNodes.length > 0) {
      footer.appendChild(nav);
    }
  });

});
</script>
